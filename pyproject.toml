[project]
name = "yalix-ambient"
version = "0.1.0"
description = "Math-generated ambient music and visuals: Python synthesis + Manim + ffmpeg"
requires-python = ">=3.12,<3.13"
dependencies = [
    "manim>=0.19.0",
    "moderngl>=5.12.0",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.scripts]
yalix-ambient = "yalix_ambient.pipeline:main"
yalix-series = "yalix_ambient.series:main"
yalix-grunge = "yalix_ambient.grunge:main"
yalix-cyberpunk = "yalix_ambient.cyberpunk:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yalix_ambient"]
